name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: Playwright's browser dependencies install on 24.04; ubuntu-latest is now 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 26: the AI-draft sandbox needs Node's network permission (25+); its tests run here.
          node-version: 26
          cache: npm
      # Build-time traces come from CPython; it must match the Python inside Pyodide (3.14),
      # which the parity tests check byte for byte.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: npm ci
      - run: node scripts/copy-pyodide.mjs
      - run: npm run -s traces
      - run: npm run -s typecheck
      - run: npm test
      # The browser download can stall; cache it, bound each try, and retry once.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright's Chromium
        timeout-minutes: 12
        run: |
          for try in 1 2; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "Install attempt $try failed or stalled; retrying."
          done
          exit 1
      - run: npm run -s e2e
        timeout-minutes: 10
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
      - name: Build for Pages
        run: BASE=/pillow/ npm run -s build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
